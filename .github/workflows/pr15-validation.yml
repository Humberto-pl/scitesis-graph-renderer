name: PR15 validation

on:
  push:
    branches:
      - codex/implementar-cargador-de-archivo-de-artifact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-cargador-de-archivo-de-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        run: |
          set +e
          npm run typecheck > ci-typecheck-output.txt 2>&1
          status=$?
          cat ci-typecheck-output.txt
          echo "$status" > ci-typecheck-status.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-typecheck-output.txt ci-typecheck-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: capture PR15 typecheck output"
            git push
          fi
