name: PR15 validation

on:
  push:
    branches:
      - codex/implementar-cargador-de-archivo-de-artifact
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-cargador-de-archivo-de-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Draft 2020-12 and QUALIS
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "uses the canonical Draft 2020-12 schema and accepts QUALIS without mutation"
      - name: Invalid JSON
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "reports invalid JSON"
      - name: Unsupported artifact type
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "rejects unsupported artifact types specifically"
      - name: Required string violation
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "rejects required/string schema violations"
      - name: Const violation
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "rejects a canonical const violation"
      - name: Additional property violation
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "rejects unknown top-level properties"
      - name: Legitimate null preservation
        continue-on-error: true
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts -t "preserves a schema-legitimate null without coercion"
      - name: File loader component tests
        continue-on-error: true
        run: npx vitest run src/components/ArtifactFileLoader.test.tsx
      - name: App import integration tests
        continue-on-error: true
        run: npx vitest run src/App.test.tsx
