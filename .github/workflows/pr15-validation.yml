name: PR15 validation

on:
  push:
    branches:
      - codex/implementar-cargador-de-archivo-de-artifact
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-cargador-de-archivo-de-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Loader unit tests
        run: npx vitest run src/import/canonicalArtifactLoader.test.ts
      - name: File loader component tests
        run: npx vitest run src/components/ArtifactFileLoader.test.tsx
      - name: App import integration tests
        run: npx vitest run src/App.test.tsx
      - name: Full test suite
        run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
