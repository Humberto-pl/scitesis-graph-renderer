name: PR15 final check

on:
  push:
    branches:
      - codex/implementar-cargador-de-archivo-de-artifact

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-cargador-de-archivo-de-artifact
      - name: Capture diff check output
        run: |
          set +e
          git diff --check origin/main...HEAD > ci-diff-output.txt 2>&1
          status=$?
          cat ci-diff-output.txt
          echo "$status" > ci-diff-status.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diff-output.txt ci-diff-status.txt
          git commit -m "ci: capture PR15 diff check output"
          git push
